[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cc2cc"
version = "3.6.0"
description = "Claude Code to Claude Code communication — file-based agent-to-agent messaging + cross-machine relay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2",
]
authors = [
    { name = "Vladimir Trojanenko", email = "vladimir.trojanenko@gmail.com" },
]
keywords = ["claude-code", "mcp", "agent-communication", "a2a"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[project.scripts]
cc2cc = "cc2cc.cli:main"
cc2cc-admin = "cc2cc.admin:main"

[project.optional-dependencies]
watch = ["watchdog"]
test = ["pytest", "httpx"]      # httpx required by fastapi.testclient in the hub tests

[tool.setuptools.packages.find]
include = ["cc2cc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
